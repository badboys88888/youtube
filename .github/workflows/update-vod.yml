name: VOD Update

on:
  schedule:
    - cron: "0 1 * * *"  # 每天; 清单没变时增量跑, 很快
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -U yt-dlp
          yt-dlp --version

      - name: Run VOD list generator
        working-directory: vod
        run: python Vod_list.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "auto update VOD list"
          git pull --rebase || true
          git push
