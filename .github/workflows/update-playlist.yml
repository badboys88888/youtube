name: Update YouTube M3U Playlist

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install nightly yt-dlp
        run: |
          pip install --pre -U yt-dlp
          python -c "import yt_dlp; print('yt-dlp version:', yt_dlp.version.__version__)"

      - name: Generate M3U
        run: |
          if [ -f yt/main.py ]; then
            cd yt && python main.py
          elif [ -f youtube/yt/main.py ]; then
            cd youtube/yt && python main.py
          elif [ -f main.py ]; then
            python main.py
          else
            echo "错误：找不到 main.py"
            find . -maxdepth 4 -name "main.py" -print
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          M3U_PATH=""
          if [ -f yt/playlist.m3u ]; then
            M3U_PATH="yt/playlist.m3u"
          elif [ -f youtube/yt/playlist.m3u ]; then
            M3U_PATH="youtube/yt/playlist.m3u"
          elif [ -f playlist.m3u ]; then
            M3U_PATH="playlist.m3u"
          fi

          if [ -z "$M3U_PATH" ]; then
            echo "错误：没有找到生成的 playlist.m3u"
            exit 1
          fi

          git add "$M3U_PATH"
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update playlist.m3u [skip ci]"
            git push
          fi
