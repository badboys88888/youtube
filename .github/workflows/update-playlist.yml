name: Update YouTube M3U Playlist

on:
  schedule:
    - cron: '0 0 * * *'   # UTC 0 点 = 北京时间早上 8 点
  workflow_dispatch:       # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # 必须，否则无法 push 回仓库

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r youtube/yt/requirements.txt

      - name: Generate M3U
        working-directory: youtube/yt
        run: python main.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add youtube/yt/playlist.m3u
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update playlist.m3u [skip ci]"
            git push
          fi
